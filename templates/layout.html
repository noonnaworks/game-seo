<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#f6f7f2">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{socialImage}}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="application/ld+json">{{schema}}</script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="{{siteName}} 홈"><span class="brand-mark" aria-hidden="true">p<span>n</span></span>{{siteName}}<span class="brand-dot">.</span></a>
      <nav aria-label="주 메뉴"><a href="/"{{homeCurrent}}>홈</a><a href="/games/"{{gamesCurrent}}>게임 목록</a></nav>
      <span class="header-note">게임을 더 즐겁게, 한 페이지씩.</span>
    </div>
  </header>
  <main id="main" class="container">{{body}}</main>
  <footer class="site-footer"><div class="container footer-inner"><div><a class="footer-brand" href="/">{{siteName}}.</a><p>다음 모험에 필요한 작은 힌트.</p></div><div><a href="/games/">게임별 공략 둘러보기 ↗</a><p>© {{year}} {{author}} · 비공식 게임 공략 사이트</p></div></div></footer>
</body>
</html>
